# Cloud compiler: builds your debug APK on GitHub servers, zero local setup.
# JAVA ANALOGY: like a remote `javac + jar` job. Every `git push` runs it and
# hands you app-debug.apk under Actions -> Artifacts (install on your phone).
name: Build debug APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (manual install)
        run: |
          # setup-android@v3 is broken: it calls the long-removed 'tools'
          # package on new cmdline-tools, failing every build. So we install
          # by hand (like setting JAVA_HOME manually vs broken installer).
          # JAVA: like downloading the JDK + setting JAVA_HOME by hand instead
          # of trusting a broken installer script. We fetch cmdline-tools,
          # then install exactly: platform-tools, android-34 platform,
          # build-tools 34.0.0. Versions pinned = reproducible builds.
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /tmp
          curl -sS -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q -o cmdtools.zip -d /usr/local/lib/android/sdk/cmdline-tools
          sudo mv /usr/local/lib/android/sdk/cmdline-tools/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" | sudo tee -a /etc/environment > /dev/null
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" | sudo tee -a /etc/environment > /dev/null
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK
        working-directory: YtbNative
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools
          # apt's 'gradle' is ANCIENT (v4, predates dependencyResolutionManagement
          # which needs 6.8+), so download the real Gradle 8.7 binary instead.
          # JAVA: like refusing a Java 6 javac and fetching JDK 17 manually.
          # NOTE: services.gradle.org 307-redirects to github releases; curl
          # without -L saves the redirect HTML (169 bytes, "not a zipfile").
          # We use the final github URL directly + fail fast (-fS) + retry.
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            cd /tmp
            rm -f gradle.zip
            curl -fSL --retry 3 -o gradle.zip https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip
            unzip -t -q gradle.zip > /dev/null
            sudo mkdir -p /opt/gradle && sudo unzip -q -o gradle.zip -d /opt/gradle
            /opt/gradle/gradle-8.7/bin/gradle wrapper --gradle-version 8.7 -p "$GITHUB_WORKSPACE/YtbNative"
            cd "$GITHUB_WORKSPACE/YtbNative"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YTB-Web-debug-apk
          path: YtbNative/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YtbNative/app/build/outputs/apk/debug/app-debug.apk
          name: YTB Web ${{ github.ref_name }}
          body: |
            ## YTB Web ${{ github.ref_name }}
            
            Personal ad-free YouTube player for Android with background playback and lock-screen controls.
            
            ### What's New in v1.0
            - **Background Playback**: Audio continues playing smoothly when the screen locks or when switching apps.
            - **Instant Ad Skip**: Mutes, fast-forwards (16x speed), and skips video ads instantly; hides banner/feed ads.
            - **Persistent Media Notification**: Real-time video title, thumbnail art, play/pause and next controls.
            - **Fullscreen Support**: Landscape fullscreen video with clean back-button transitions.
            - **Pixel / Android 13+ Compliance**: Full runtime notification permission and foreground service compatibility.
            - **Zero Tracking**: No Firebase, no third-party telemetry.
            
            ### Installation
            1. Download `app-debug.apk` attached below.
            2. Install on your Android phone.
            3. On first launch, tap **Allow** when prompted for notification permissions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fresh-slate telemetry: every APK build archives the previous run's log
      # (telemetry.log -> telemetry-<run>.log) so the next install starts from
      # zero and old lines can never confuse a new diagnosis. Like rotating
      # log files on each deploy (logrotate) — history kept, confusion gone.
      - name: Rotate telemetry log
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f telemetry.log ] && [ -s telemetry.log ]; then
            TS=$(date -u +%Y%m%d-%H%M%S)
            mkdir -p telemetry-history
            mv telemetry.log "telemetry-history/telemetry-${TS}-run${{ github.run_number }}.log"
            echo "Rotated previous telemetry log to telemetry-history/"
          else
            echo "No telemetry.log to rotate (first build or already fresh)."
          fi
          touch telemetry.log

